<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="weather-app">
        <header class="app-header">
            <h1>Weather App</h1>
            <p>Search for a city to check the current weather.</p>
        </header>

        <form class="search-form" id="search-form">
            <label for="city-input" class="sr-only">
                City name
            </label>

            <input
                type="text"
                id="city-input"
                placeholder="Enter a city"
                autocomplete="off"
                required
            >

            <button type="submit">
                Search
            </button>
        </form>

        <p id="loading-message" class="message" hidden>
            Loading weather...
        </p>

        <p id="error-message" class="message error-message" hidden></p>

        <section id="weather-container" class="weather-container">
            <p class="empty-state">
                Search for a city to see the weather.
            </p>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
